<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6FAFE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MeuSemestre">
<!-- Fica inline de propósito: aplica o tema escuro antes da primeira pintura, para a tela não piscar em branco. -->
<script>try{ const t=localStorage.getItem("meusemestre-tema"); if(t==="escuro"||(t!=="claro"&&matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("escuro"); }catch(e){}</script>
<title>MeuSemestre</title>
<!-- A fonte do texto (latin) começa a baixar junto com o CSS, para a troca da fonte reserva acontecer cedo. -->
<link rel="preload" href="fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>
<header>
  <div class="barra-topo" style="display:flex;align-items:center;gap:8px"><img src="img/icon-192.png" alt="" width="26" height="26" style="border-radius:7px">MeuSemestre</div><button class="tema" id="btn-tema" onclick="trocarTema()"></button>
  <div class="barra-titulo"><div id="topo"></div><h1 id="titulo">Faltas e Notas</h1></div>
</header>
<main id="app"></main>
<footer>Dados salvos apenas neste aparelho. Projeto independente, não é um sistema oficial.<br><a href="#" onclick="ir('sobre');return false" style="color:var(--primaria);font-weight:600;display:inline-block;margin-top:8px">Sobre o MeuSemestre</a></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
