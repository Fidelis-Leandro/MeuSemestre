<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6FAFE">
<link rel="manifest" href="manifest.json">

<script>try{ const t=localStorage.getItem("meusemestre-tema"); if(t==="escuro"||(t!=="claro"&&matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("escuro"); }catch(e){}</script>
<title>MeuSemestre</title>
<style>
  :root{
    --primaria:#0C447C; --primaria-clara:#E6F1FB; --destaque:#0C447C;
    --topo:#B5D4F4; --topo-texto:#042C53; --barra-cor:#85B7EB;
    --botao:#FAC775; --botao-texto:#633806;
    --texto:#1f2a36; --suave:#5f6b78; --fundo:#F6FAFE; --card:#ffffff; --borda:#dce8f4;
    --ok:#639922; --atencao:#BA7517; --exame:#D85A30; --erro:#E24B4A;
    --ok-f:#EAF3DE; --ok-t:#27500A; --at-f:#FAEEDA; --at-t:#633806; --ex-f:#FAECE7; --ex-t:#712B13; --er-f:#FCEBEB; --er-t:#791F1F; --ne-f:#EEF1F4; --ne-t:#4a5562;
    --raio:16px;
    --campo:#fff; --perigo-fundo:#FCEBEB; --semana-fundo:#FAEEDA; --semana-texto:#633806; --hoje-fundo:#F5C4B3; --hoje-texto:#712B13; --aviso-fundo:#FDF6E8;
  }
  html.escuro{
    --primaria:#B5D4F4; --primaria-clara:#17293b; --destaque:#B5D4F4;
    --topo:#16283a; --topo-texto:#E6F1FB; --barra-cor:#85B7EB;
    --botao:#FAC775; --botao-texto:#412402;
    --texto:#e6edf5; --suave:#93a3b5; --fundo:#0d1620; --card:#142130; --borda:#22344a;
    --ok:#97C459; --atencao:#EF9F27; --exame:#F0997B; --erro:#F09595;
    --ok-f:#23360f; --ok-t:#C0DD97; --at-f:#3b2a0c; --at-t:#FAC775; --ex-f:#3d2015; --ex-t:#F5C4B3; --er-f:#3d1818; --er-t:#F7C1C1; --ne-f:#1e2c3b; --ne-t:#b6c3d0;
    --campo:#0d1620; --perigo-fundo:#3d1818; --semana-fundo:#3b2a0c; --semana-texto:#FAC775; --hoje-fundo:#4a2516; --hoje-texto:#F5C4B3; --aviso-fundo:#2a2210;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto)}
  header{position:relative;background:var(--topo);color:var(--topo-texto);border-radius:24px;width:calc(100% - 32px);max-width:688px;margin:max(12px,env(safe-area-inset-top)) auto 0}
  .barra-topo{padding:14px 16px 0;font-size:.8rem;font-weight:600;opacity:.75}
  .barra-titulo{padding:4px 16px 18px}
  header h1{margin:0;font-size:1.5rem;font-weight:800}
  .tema{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.55);color:var(--topo-texto);font-weight:600;padding:6px 10px;font-size:.8rem}
  html.escuro .tema{background:rgba(255,255,255,.1)}
  main{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:18px;margin-bottom:14px}
  .nome-cad{color:var(--destaque);font-size:1.25rem;font-weight:700;margin:4px 0 8px}
  .rotulo{color:var(--suave);font-size:.8rem}
  .chip{display:inline-block;background:var(--chip);color:#fff;border-radius:6px;padding:4px 10px;font-size:.85rem;margin-top:6px}
  .media-linha{display:flex;justify-content:space-between;align-items:center;background:var(--primaria-clara);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:1.1rem;font-weight:700;color:var(--primaria)}
  .nota-bloco{margin:12px 0;color:var(--suave);font-size:1.05rem}
  .nota-bloco .sub{display:flex;gap:8px;align-items:center;margin:8px 0 0 10px;color:var(--suave);font-size:.95rem}
  .nota-bloco .sub::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--barra-cor);flex:none}
  .nota-bloco .nm{color:var(--primaria)}
  .nota-bloco input{width:80px;padding:6px;margin-left:auto}
  .card h2{margin:0 0 4px;font-size:1.1rem}
  .meta{color:var(--suave);font-size:.85rem}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--botao);color:var(--botao-texto);font-weight:600}
  button.sec{background:var(--primaria-clara);color:var(--primaria)}
  button.perigo{background:var(--perigo-fundo);color:var(--erro)}
  button.mini{padding:6px 10px;font-size:.85rem}
  .linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .entre{justify-content:space-between}
  input,select{font:inherit;padding:10px;border:1px solid var(--borda);border-radius:10px;width:100%;background:var(--campo);color:var(--texto)}
  input[type=date]{color-scheme:light} html.escuro input[type=date]{color-scheme:dark}
  label{font-size:.85rem;color:var(--suave);display:block;margin:10px 0 4px}
  .barra{height:10px;background:var(--primaria-clara);border-radius:99px;overflow:hidden;margin:8px 0}
  .barra>div{height:100%;border-radius:99px;transition:width .3s}
  .status{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
  .s-ok{background:var(--ok-f);color:var(--ok-t)} .s-atencao{background:var(--at-f);color:var(--at-t)} .s-exame{background:var(--ex-f);color:var(--ex-t)} .s-erro{background:var(--er-f);color:var(--er-t)} .s-neutro{background:var(--ne-f);color:var(--ne-t)}
  .destaque{background:var(--primaria-clara);border-radius:12px;padding:14px;margin-top:10px}
  .destaque .grande{font-size:1.8rem;font-weight:800;color:var(--primaria)}
  .aval{display:grid;grid-template-columns:1fr 70px 80px 32px;gap:6px;align-items:center;margin-bottom:6px}
  .aval input{padding:8px}
  .x{background:none;color:var(--erro);padding:4px;font-size:1.1rem}
  .vazio{text-align:center;color:var(--suave);padding:40px 10px}
  .volta{background:none;color:var(--topo-texto);padding:0;margin-bottom:6px;font-weight:400}
  .contador{font-size:2rem;font-weight:800}
  .aviso{font-size:.85rem;margin-top:6px}
  footer{text-align:center;color:var(--suave);font-size:.75rem;padding:20px}
  .abas{display:flex;background:var(--primaria-clara);border-radius:12px;padding:4px;margin-bottom:14px}
  .abas button{flex:1;background:none;color:var(--primaria)} .abas button.on{background:var(--card);color:var(--primaria);box-shadow:0 1px 3px rgba(12,68,124,.12)}
  .ag{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borda)} .ag:last-child{border-bottom:0}
  .ag-data{width:54px;text-align:center;border-radius:10px;padding:6px 0;background:var(--primaria-clara);color:var(--primaria);flex:none}
  .ag-data b{display:block;font-size:1.3rem;line-height:1} .ag-data span{font-size:.7rem;text-transform:uppercase}
  .ag-hoje{background:var(--hoje-fundo);color:var(--hoje-texto)} .ag-semana{background:var(--semana-fundo);color:var(--semana-texto)} .ag-passou{opacity:.55}
  .tag{font-size:.75rem;font-weight:700;color:var(--primaria);text-transform:uppercase;letter-spacing:.5px}
  .card-cad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s}
  .card-cad.arrastando{position:relative;z-index:5;box-shadow:0 12px 30px rgba(12,68,124,.25);transition:none;cursor:grabbing}
  .resumo{display:flex;gap:16px;margin-top:10px;font-size:.85rem}
  .resumo b{display:block;font-size:1.1rem;color:var(--texto)}
</style>
</head>
<body>
<header>
  <div class="barra-topo" style="display:flex;align-items:center;gap:8px"><img src="icon-192.png" alt="" width="26" height="26" style="border-radius:7px">MeuSemestre</div><button class="tema" id="btn-tema" onclick="trocarTema()"></button>
  <div class="barra-titulo"><div id="topo"></div><h1 id="titulo">Faltas e Notas</h1></div>
</header>
<main id="app"></main>
<footer>Dados salvos apenas neste aparelho. Projeto independente, não é um sistema oficial.<br><a href="#" onclick="ir('sobre');return false" style="color:var(--primaria);font-weight:600;display:inline-block;margin-top:8px">Sobre o MeuSemestre</a></footer>

<script>
const CHAVE = "ufcspa-faltas-notas-v1";
let dados = carregar(); dados.eventos = dados.eventos || []; dados.criadoEm = dados.criadoEm || new Date().toISOString();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
let tela = {nome:"lista"};

function carregar(){ try{ return JSON.parse(localStorage.getItem(CHAVE)) || {cadeiras:[]}; }catch(e){ return {cadeiras:[]}; } }
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(dados)); }catch(e){} }
const id = () => Math.random().toString(36).slice(2,10);
const fmt = n => (Math.round(n*100)/100).toLocaleString("pt-BR",{maximumFractionDigits:2});
const fmt2 = n => n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const virg = v => v===null||v===undefined||v==="" ? "" : String(v).replace(".",",");
const num = v => { if(v===""||v===null||v===undefined) return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Datas ---------- */
function hojeISO(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dataDe(iso){ const [a,m,d]=iso.split("-").map(Number); return new Date(a,m-1,d); }
function diasAte(iso){ return Math.round((dataDe(iso)-hojeISO())/86400000); }
function dataCurta(iso){ const [a,m,d]=iso.split("-"); return `${d}/${m}`; }
function quando(n){ return n===0?"hoje":n===1?"amanhã":n>1?`em ${n} dias`:n===-1?"ontem":`há ${-n} dias`; }
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const TIPOS=["Prova","Trabalho","Seminário","Aula prática","Aula EAD","Sem aula","Data limite","Outro"];
function itensAgenda(){
  const it=[];
  dados.cadeiras.forEach(c=>c.avaliacoes.forEach(a=>{ if(a.data) it.push({data:a.data,cadeira:c.nome,cid:c.id,tipo:"Avaliação",titulo:a.nome,lancada:notaDe(a)!==null}); }));
  dados.eventos.forEach(e=>{ const c=achar(e.cadeiraId); it.push({data:e.data,cadeira:c?c.nome:"Geral",cid:c?c.id:null,tipo:e.tipo,titulo:e.obs||e.tipo,evento:e.id}); });
  return it.sort((a,b)=>a.data.localeCompare(b.data));
}
function itemAgendaHTML(x){
  const n=diasAte(x.data), d=dataDe(x.data);
  const cls=n<0?"ag-passou":n<=1?"ag-hoje":n<=6?"ag-semana":"";
  return `<div class="ag ${n<0?"ag-passou":""}">
    <div class="ag-data ${cls}"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]}</span></div>
    <div style="flex:1;cursor:${x.cid?"pointer":"default"}" ${x.cid?`onclick="ir('detalhe','${x.cid}')"`:""}>
      <div class="tag">${esc(x.tipo)} &middot; ${quando(n)}</div>
      <div style="font-weight:700">${esc(x.titulo)}</div>
      <div class="meta">${esc(x.cadeira)}${x.lancada?" &middot; nota lançada":""}</div></div>
    ${x.evento?`<button class="x" onclick="excluirEvento('${x.evento}')">&times;</button>`:""}</div>`;
}
function abas(at){ return `<div class="abas"><button class="${at==="lista"?"on":""}" onclick="ir('lista')">Cadeiras</button><button class="${at==="agenda"?"on":""}" onclick="ir('agenda')">Agenda</button></div>`; }

/* ---------- Regras ---------- */
// Período = 50 min. Faltas máximas = 25% dos períodos (arredondado para baixo).
function periodos(ch){ return Math.round(ch*60/50); }
function faltasMax(ch){ return Math.floor(periodos(ch)*0.25); }
// Exame: final = 0,6*média + 0,4*exame >= 6  ->  exame necessário = 15 - 1,5*média
function notaExame(media){ return 15 - 1.5*media; }

function temSubs(a){ return a.subs && a.subs.length>0; }
function notaDe(a){ // nota da avaliação (0-10) ou null se incompleta
  if(!temSubs(a)) return num(a.nota);
  if(a.subs.some(sb=>num(sb.nota)===null)) return null;
  return a.subs.reduce((t,sb)=>t+num(sb.nota)*(num(sb.peso)||0)/100,0);
}
function calcularNotas(c){
  const avs = c.avaliacoes;
  const pesoTotal = avs.reduce((s,a)=>s+(num(a.peso)||0),0);
  let pontos=0, pesoFeito=0;
  avs.forEach(a=>{
    const p=num(a.peso)||0;
    if(temSubs(a)){
      a.subs.forEach(sb=>{ const n=num(sb.nota), sp=(num(sb.peso)||0)/100; if(n!==null){ pontos+=n*p/100*sp; pesoFeito+=p*sp; } });
    } else { const n=num(a.nota); if(n!==null){ pontos+=n*p/100; pesoFeito+=p; } }
  });
  const pesoRestante = Math.max(0,100-pesoFeito);
  return {pesoTotal, pontos, pesoFeito, pesoRestante, maxPossivel: pontos + pesoRestante*10/100};
}

function situacao(c){
  const max = faltasMax(c.ch);
  if(c.faltas > max) return {cls:"s-erro", txt:"Reprovado por falta", det:`Você passou do limite de ${max} faltas (75% de presença).`};
  const n = calcularNotas(c);
  if(c.avaliacoes.length===0) return {cls:"s-neutro", txt:"Sem avaliações", det:"Cadastre as avaliações e os pesos."};
  const subRuim=c.avaliacoes.find(a=>temSubs(a)&&Math.abs(a.subs.reduce((t,sb)=>t+(num(sb.peso)||0),0)-100)>0.01);
  if(subRuim) return {cls:"s-neutro", txt:"Pesos incompletos", det:`As partes de "${esc(subRuim.nome)}" devem somar 100%.`};
  if(Math.abs(n.pesoTotal-100)>0.01) return {cls:"s-neutro", txt:"Pesos incompletos", det:`Os pesos somam ${fmt(n.pesoTotal)}%. Ajuste para 100%.`};

  if(n.pesoRestante<=0.0001){
    const m=n.pontos;
    if(m>=7) return {cls:"s-ok", txt:"Aprovado", det:`Média final ${fmt(m)}.`, media:m};
    if(m<4) return {cls:"s-erro", txt:"Reprovado", det:`Média ${fmt(m)}, abaixo de 4. Não tem direito a exame.`, media:m};
    const e=num(c.exame);
    if(e!==null){
      const f=0.6*m+0.4*e;
      return f>=6 ? {cls:"s-ok", txt:"Aprovado no exame", det:`Nota final ${fmt(f)} (mínimo 6).`, media:m}
                  : {cls:"s-erro", txt:"Reprovado no exame", det:`Nota final ${fmt(f)} (mínimo 6).`, media:m};
    }
    return {cls:"s-exame", txt:"Exame", det:`Média ${fmt(m)}. Você precisa de ${fmt(notaExame(m))} no exame.`, media:m, exame:notaExame(m)};
  }

  const rest=n.pesoRestante/100;
  const precisa7=(7-n.pontos)/rest;
  const precisa4=(4-n.pontos)/rest;
  if(precisa7<=0) return {cls:"s-ok", txt:"Aprovação garantida", det:"Você já atingiu média 7, mesmo tirando zero no resto."};
  if(precisa7<=10) return {cls:"s-atencao", txt:"Em andamento", det:`Precisa de média ${fmt(precisa7)} nas próximas avaliações para passar direto.`, precisa:precisa7};
  if(precisa4<=10) return {cls:"s-exame", txt:"Rumo ao exame", det:`Passar direto não é mais possível (máximo ${fmt(n.maxPossivel)}). Precisa de média ${fmt(Math.max(0,precisa4))} nas próximas para ter direito a exame.`, precisa4:Math.max(0,precisa4)};
  return {cls:"s-erro", txt:"Reprovação provável", det:`Mesmo com 10 em tudo, a média máxima é ${fmt(n.maxPossivel)}, abaixo de 4.`};
}

/* ---------- Telas ---------- */
function render(){
  const app=document.getElementById("app"), topo=document.getElementById("topo"), titulo=document.getElementById("titulo");
  topo.innerHTML="";
  if(tela.nome==="lista"){ titulo.textContent="Minhas cadeiras"; app.innerHTML=telaLista(); }
  else if(tela.nome==="form"){ titulo.textContent=tela.id?"Editar cadeira":"Nova cadeira"; topo.innerHTML=`<button class="volta" onclick="ir('lista')">&larr; Voltar</button>`; app.innerHTML=telaForm(); desenharAvsForm(); }
  else if(tela.nome==="sobre"){ titulo.textContent="Sobre"; topo.innerHTML=`<button class="volta" onclick="ir('lista')">&larr; Voltar</button>`; app.innerHTML=telaSobre(); }
  else if(tela.nome==="agenda"){ titulo.textContent="Agenda"; app.innerHTML=telaAgenda(); }
  else if(tela.nome==="evento"){ titulo.textContent="Novo evento"; topo.innerHTML=`<button class="volta" onclick="ir('agenda')">&larr; Voltar</button>`; app.innerHTML=telaEvento(); }
  else if(tela.nome==="importar"){ titulo.textContent="Revisar importação"; topo.innerHTML=`<button class="volta" onclick="ir('lista')">&larr; Cancelar</button>`; app.innerHTML=telaImportar(); }
  else if(tela.nome==="detalhe"){ const c=achar(tela.id); if(!c){ir("lista");return;} titulo.textContent=c.nome; topo.innerHTML=`<button class="volta" onclick="ir('lista')">&larr; Voltar</button>`; app.innerHTML=telaDetalhe(c); }
}
function ir(nome,id){ tela={nome,id}; render(); window.scrollTo(0,0); }
function achar(i){ return dados.cadeiras.find(c=>c.id===i); }

function telaLista(){
  const prox=itensAgenda().filter(x=>diasAte(x.data)>=0 && x.tipo==="Avaliação" && !x.lancada).slice(0,3);
  let h=abas("lista")+avisoBackup()+termometro()+(prox.length?`<div class="card"><div class="linha entre"><h2>Próximas avaliações</h2><button class="sec mini" onclick="ir('agenda')">Ver agenda</button></div>${prox.map(itemAgendaHTML).join("")}</div>`:"")+`<div class="linha entre" style="margin-bottom:14px"><span class="meta">${dados.cadeiras.length} cadeira(s)</span><div class="linha"><button class="sec" onclick="document.getElementById('pdf-in').click()">Importar comprovante (PDF)</button><button onclick="ir('form')">+ Nova cadeira</button></div></div>
  <input type="file" id="pdf-in" accept="application/pdf" style="display:none" onchange="importarPDF(this.files[0]);this.value=''">
  <div id="imp-msg"></div>`;
  if(!dados.cadeiras.length) return abas("lista")+`
    <div class="card" style="text-align:center;padding:24px 18px">
      <h2 style="font-size:1.25rem">Comece pelo seu semestre</h2>
      <div class="meta" style="margin:6px 0 18px">Cadastre suas cadeiras para acompanhar faltas, notas e provas.</div>
      <div style="background:var(--primaria-clara);border-radius:14px;padding:16px;text-align:left">
        <div class="tag" style="margin-bottom:4px">Mais rápido</div>
        <div style="font-weight:700;font-size:1.05rem;color:var(--primaria)">Importar o comprovante de matrícula</div>
        <div class="meta" style="margin:6px 0 12px">Baixe o <b>Comprovante de Matrícula</b> em PDF no portal do aluno e escolha o arquivo aqui. O app cadastra todas as cadeiras, com carga horária e horários das aulas. O arquivo é lido só no seu celular e não é enviado para lugar nenhum.</div>
        <button style="width:100%" onclick="document.getElementById('pdf-in').click()">Escolher o PDF do comprovante</button>
      </div>
      <div class="meta" style="margin:14px 0 8px">ou</div>
      <button class="sec" style="width:100%" onclick="ir('form')">Cadastrar uma cadeira manualmente</button>
    </div>
    <input type="file" id="pdf-in" accept="application/pdf,.pdf" style="display:none" onchange="importarPDF(this.files[0]);this.value=''">
    <div id="imp-msg"></div>`+cardBackup();
  const manual=dados.ordem==="manual";
  h+=`<div class="meta" style="font-size:.8rem;margin:4px 0 10px">Segure um card e arraste para mudar a ordem.</div><div id="lista-cad">`;
  (manual?dados.cadeiras:porUrgencia(dados.cadeiras)).forEach(c=>{
    const max=faltasMax(c.ch), s=situacao(c), n=calcularNotas(c);
    const pct=Math.min(100,c.faltas/max*100||0);
    h+=`<div class="card card-cad" data-id="${c.id}" onclick="if(!_arrastou) ir('detalhe','${c.id}')" style="cursor:pointer">
      <div class="rotulo">${c.ch}h &middot; ${periodos(c.ch)} períodos</div>
      <div class="nome-cad">${esc(c.nome)}</div>
      <div class="meta">Faltas lançadas: ${c.faltas} de ${max}</div>
      <div class="barra"><div style="width:${pct}%;background:${corFalta(c.faltas,max)}"></div></div>
      <span class="status ${s.cls}">${s.txt}</span>
      <div class="media-linha"><span>Média</span><span>${fmt2(n.pontos)}</span></div>
      <div class="meta">${s.det}</div></div>`;
  });
  return h+`</div>`+cardBackup();
}
function corFalta(f,max){ const r=max-f; if(f>max) return "var(--erro)"; if(r<=2) return "var(--exame)"; if(f/max>=.5) return "var(--atencao)"; return "var(--ok)"; }

function telaForm(){
  const c = tela.id ? achar(tela.id) : {nome:"",ch:60,periodosDia:2,avaliacoes:[{nome:"Prova 1",peso:40},{nome:"Prova 2",peso:40},{nome:"Trabalho",peso:20}]};

function desenharAvsForm(){

function addSub(i){ const a=_avsForm[i]; a.subs=a.subs||[];

  else a.subs.push({nome:`Parte ${a.subs.length+1}`,peso:"",nota:null});
  desenharAvsForm(); }
function somaForm(){

  const s=_avsForm.reduce((t,a)=>t+(num(a.peso)||0),0); const el=document.getElementById("f-soma"); el.textContent=`Total: ${fmt(s)}%`; el.style.color=Math.abs(s-100)<.01?"var(--ok)":"var(--erro)"; }

  } else {
    dados.cadeiras.push({id:id(),nome,ch,periodosDia:pd,faltas:0,exame:null,avaliacoes:_avsForm.map(mapAv)});
  }
  salvar(); ir("detalhe", tela.id || dados.cadeiras[dados.cadeiras.length-1].id);

function mapAv(a){ const o={id:a.id||id(),nome:a.nome,peso:num(a.peso)||0,nota:a.nota??null,data:a.data||""};
  if(a.subs&&a.subs.length){ o.subs=a.subs.map(sb=>({nome:sb.nome,peso:num(sb.peso)||0,nota:sb.nota??null})); o.nota=null; }
  return o; }
function alertaCampo(i){ const e=document.getElementById(i); e.style.borderColor="var(--erro)"; e.focus(); }

function telaDetalhe(c){
  const max=faltasMax(c.ch), rest=max-c.faltas, s=situacao(c), n=calcularNotas(c);
  const pct=Math.min(100,c.faltas/max*100);
  let avisoF = c.faltas>max ? `<div class="aviso" style="color:var(--erro)">Limite ultrapassado. Sem os 75% de presença você reprova e não pode fazer exame.</div>`
    : rest<=2 ? `<div class="aviso" style="color:var(--exame)">Atenção: restam só ${rest} falta(s).</div>` : `<div class="aviso meta">Restam ${rest} falta(s). ${c.aulas&&c.aulas.length ? c.aulas.map(a=>`${a.dia}: ${a.periodos}`).join(" &middot; ")+" período(s) por aula." : `Um dia inteiro de aula = ${c.periodosDia} falta(s).`}</div>`;

  let h=`<div class="card">
    <div class="linha entre"><h2>Faltas</h2><span class="meta">${c.ch}h &middot; ${periodos(c.ch)} períodos</span></div>
    <div class="linha entre" style="margin-top:6px"><div><span class="contador">${c.faltas}</span><span class="meta"> / ${max} permitidas</span></div></div>
    <div class="barra"><div style="width:${pct}%;background:${corFalta(c.faltas,max)}"></div></div>
    ${avisoF}
    <div class="linha" style="margin-top:12px">
      ${c.aulas&&c.aulas.length ? c.aulas.map(a=>`<button onclick="falta('${c.id}',${a.periodos})">Faltei ${a.dia.toLowerCase()} (+${a.periodos})</button>`).join("")
        : `<button onclick="falta('${c.id}',${c.periodosDia})">Faltei no dia (+${c.periodosDia})</button>`}
      <button class="sec" onclick="falta('${c.id}',1)">+1 período</button>
      <button class="sec" onclick="falta('${c.id}',-1)">&minus;1</button>
    </div></div>`;

  h+=`<div class="card"><div class="linha entre"><h2>Notas</h2><span class="status ${s.cls}">${s.txt}</span></div>
    <div class="meta" style="margin-bottom:10px">Digite a nota (0 a 10) quando receber.</div>`;
  h+=`<div class="media-linha"><span>Média</span><span>${fmt2(n.pontos)}</span></div>`;
  c.avaliacoes.forEach((a,i)=>{
    const v=notaDe(a);
    if(a.data){ const nd=diasAte(a.data);
      h+=`<div class="meta" style="margin-top:10px;color:${v===null&&nd>=0&&nd<=1?"var(--exame)":v===null&&nd>=0&&nd<=6?"var(--atencao)":"var(--suave)"}">${esc(a.nome)} &middot; ${dataCurta(a.data)} &middot; ${v!==null?"nota lançada":nd>=0?(nd<=1?quando(nd):"faltam "+nd+" dias"):"já passou"}${v===null&&s.precisa!==undefined?` &middot; você precisa de ${fmt(s.precisa)}`:v===null&&s.precisa4!==undefined?` &middot; precisa de ${fmt(s.precisa4)} para ter exame`:""}</div>`; }
    if(temSubs(a)){
      h+=`<div class="nota-bloco">Nota ${i+1}: ${v!==null?fmt2(v)+" ":""}(${fmt(a.peso)}%) <span class="nm" style="font-size:.9rem">&middot; ${esc(a.nome)}</span>`+
        a.subs.map((sb,j)=>{ const sv=num(sb.nota); return `<div class="sub"><span><span class="nm">${esc(sb.nome)}</span> &middot; ${sv!==null?"Lançado":"Não lançado"} &middot; Peso ${fmt(sb.peso)}%</span>
        <input inputmode="decimal" placeholder="nota" value="${virg(sb.nota)}" onchange="notaSub('${c.id}',${i},${j},this.value)"></div>`; }).join("")+`</div>`;
      return;
    }
    h+=`<div class="nota-bloco">Nota ${i+1}: ${v!==null?fmt2(v)+" ":""}(${fmt(a.peso)}%)
      <div class="sub"><span><span class="nm">${esc(a.nome)}</span> &middot; ${v!==null?"Lançado":"Não lançado"}</span>
      <input inputmode="decimal" placeholder="nota" value="${virg(a.nota)}" onchange="nota('${c.id}',${i},this.value)"></div></div>`;
  });
  h+=`<div class="resumo"><div>Já avaliado<b>${fmt(n.pesoFeito)}%</b></div><div>Máximo possível<b>${fmt(n.maxPossivel)}</b></div></div>`;
  h+=blocoSituacao(c,s,n)+`</div>`;

  if(n.pesoRestante>0 && Math.abs(n.pesoTotal-100)<.01 && c.faltas<=max){
    h+=`<div class="card"><h2>Simulador</h2><div class="meta">E se eu tirar esta nota em todas as avaliações que faltam?</div>
      <input id="sim" inputmode="decimal" placeholder="Ex.: 7" style="margin-top:10px" oninput="simular('${c.id}')">
      <div id="sim-res"></div></div>`;
  }

  h+=`<div class="card meta" style="font-size:.8rem"><b style="color:var(--texto)">Regras usadas</b><br>
    Média 7 ou mais: aprovado direto. Média de 4 a 6,9: exame. Abaixo de 4: reprovado.<br>
    Exame: nota final = 0,6 &times; média + 0,4 &times; exame, precisa ser 6 ou mais.<br>
    Presença mínima de 75% (período de 50 min).</div>
    <button class="sec" onclick="ir('form','${c.id}')">Editar cadeira</button>`;
  return h;
}

function blocoSituacao(c,s,n){
  let grande="", rot="";
  if(s.precisa!==undefined){ rot="Média mínima nas próximas avaliações"; grande=fmt(s.precisa); }
  else if(s.exame!==undefined){ rot="Nota necessária no exame"; grande=fmt(s.exame); }
  else if(s.precisa4!==undefined){ rot="Média mínima nas próximas para ter exame"; grande=fmt(s.precisa4); }
  let h=`<div class="destaque">${rot?`<div class="meta">${rot}</div><div class="grande">${grande}</div>`:""}<div>${s.det}</div>`;
  if(s.exame!==undefined || (n.pesoRestante<=0 && num(c.exame)!==null)){
    h+=`<label>Nota do exame (quando sair)</label><input inputmode="decimal" value="${virg(c.exame)}" onchange="exame('${c.id}',this.value)">`;
  }
  return h+`</div>`;
}

function simular(cid){
  const c=achar(cid), n=calcularNotas(c), v=num(document.getElementById("sim").value), el=document.getElementById("sim-res");
  if(v===null||v<0||v>10){ el.innerHTML=""; return; }
  const m=n.pontos+v*n.pesoRestante/100;
  let t;
  if(m>=7) t=`<span class="status s-ok">Aprovado direto</span><div style="margin-top:6px">Média final ${fmt(m)}.</div>`;
  else if(m>=4) t=`<span class="status s-exame">Exame</span><div style="margin-top:6px">Média final ${fmt(m)}. Você precisaria de <b>${fmt(notaExame(m))}</b> no exame.</div>`;
  else t=`<span class="status s-erro">Reprovado</span><div style="margin-top:6px">Média final ${fmt(m)}, abaixo de 4.</div>`;
  el.innerHTML=`<div class="destaque">${t}</div>`;
}

function falta(cid,d){ const c=achar(cid); c.faltas=Math.max(0,c.faltas+d); salvar(); render(); }
function limitar(v){ let n=num(v); return n===null?null:Math.min(10,Math.max(0,n)); }
function aprovada(c){ return situacao(c).cls==="s-ok"; }
function lancar(cid,muda){ const c=achar(cid), antes=aprovada(c); muda(c); salvar(); render(); if(!antes && aprovada(c)) celebrar(c); }
function nota(cid,i,v){ lancar(cid,c=>c.avaliacoes[i].nota=limitar(v)); }
function notaSub(cid,i,j,v){ lancar(cid,c=>c.avaliacoes[i].subs[j].nota=limitar(v)); }
function exame(cid,v){ lancar(cid,c=>c.exame=limitar(v)); }

const URGENCIA={"s-erro":0,"s-exame":1,"s-atencao":2,"s-neutro":3,"s-ok":4};

/* ---------- Reordenar arrastando ---------- */
let _arrastou=false;
(function(){
  let el=null, timer=null, inicioY=0, inicioX=0, pegaY=0, ativo=false;
  const lista=()=>document.getElementById("lista-cad");
  function comecar(e){
    const card=e.target.closest(".card-cad"); if(!card || e.target.closest("button,input")) return;
    el=card; inicioY=e.clientY; inicioX=e.clientX; _arrastou=false;
    timer=setTimeout(()=>{ ativo=true; _arrastou=true;
      if(dados.ordem!=="manual"){ dados.cadeiras=[...lista().querySelectorAll(".card-cad")].map(n=>achar(n.dataset.id)); dados.ordem="manual"; }
      pegaY=inicioY-el.getBoundingClientRect().top; el.classList.add("arrastando");
      if(navigator.vibrate) navigator.vibrate(15); },380);
  }
  function mover(e){
    if(!el) return;
    if(!ativo){ if(Math.abs(e.clientY-inicioY)>8||Math.abs(e.clientX-inicioX)>8){ clearTimeout(timer); el=null; } return; }
    el.style.transform=""; const topo=el.getBoundingClientRect().top;
    el.style.transform=`translateY(${e.clientY-pegaY-topo}px) scale(1.02)`;
    const ant=el.previousElementSibling, prox=el.nextElementSibling;
    if(ant){ const r=ant.getBoundingClientRect(); if(e.clientY<r.top+r.height/2){ lista().insertBefore(el,ant); return mover(e); } }
    if(prox){ const r=prox.getBoundingClientRect(); if(e.clientY>r.top+r.height/2){ lista().insertBefore(prox,el); return mover(e); } }
    const m=60; if(e.clientY<m) scrollBy(0,-8); else if(e.clientY>innerHeight-m) scrollBy(0,8);
  }
  function soltar(){
    clearTimeout(timer);
    if(el && ativo){
      el.classList.remove("arrastando"); el.style.transform="";
      dados.cadeiras=[...lista().querySelectorAll(".card-cad")].map(n=>achar(n.dataset.id)); dados.ordem="manual"; salvar();
      setTimeout(()=>{ _arrastou=false; render(); },0);
    }
    el=null; ativo=false;
  }
  addEventListener("pointerdown",comecar);
  addEventListener("pointermove",mover);
  addEventListener("pointerup",soltar); addEventListener("pointercancel",soltar);
  addEventListener("touchmove",e=>{ if(ativo) e.preventDefault(); },{passive:false});
  addEventListener("contextmenu",e=>{ if(e.target.closest(".card-cad")) e.preventDefault(); });
})();

/* ---------- Termômetro e comemoração ---------- */
function termometro(){
  const n=dados.cadeiras.length; if(!n) return "";
  const g={ok:0,atencao:0,exame:0,erro:0,neutro:0};
  dados.cadeiras.forEach(c=>{ g[situacao(c).cls.slice(2)]++; });
  const seg=(k,cor)=>g[k]?`<div style="flex:${g[k]};background:${cor}"></div>`:"";
  const leg=(k,cor,t)=>g[k]?`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:10px;height:10px;border-radius:3px;background:${cor};display:inline-block"></i>${g[k]} ${t}</span>`:"";
  const frase = g.ok===n ? "Semestre garantido. Todas as cadeiras aprovadas!" : g.ok ? `Faltam ${n-g.ok} para fechar o semestre.` : "Nenhuma cadeira garantida ainda. Bora!";
  return `<div class="card">
    <div class="linha entre"><h2>Seu semestre</h2><span style="font-weight:800;color:var(--primaria);font-size:1.1rem">${g.ok} de ${n}</span></div>
    <div class="meta">cadeiras garantidas &middot; ${frase}</div>
    <div style="display:flex;gap:3px;height:16px;border-radius:99px;overflow:hidden;margin:12px 0 10px;background:var(--primaria-clara)">
      ${seg("ok","var(--ok)")}${seg("atencao","var(--barra-cor)")}${seg("exame","var(--atencao)")}${seg("erro","var(--erro)")}${seg("neutro","var(--borda)")}
    </div>
    <div class="meta" style="font-size:.8rem">${leg("ok","var(--ok)","garantida(s)")}${leg("atencao","var(--barra-cor)","em andamento")}${leg("exame","var(--atencao)","rumo ao exame")}${leg("erro","var(--erro)","em risco")}${leg("neutro","var(--borda)","sem notas")}</div>
  </div>`;
}
function celebrar(c){
  const g=dados.cadeiras.filter(aprovada).length, n=dados.cadeiras.length;
  const fundo=document.createElement("div");
  fundo.style.cssText="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(4,44,83,.35);padding:20px";
  fundo.innerHTML=`<canvas style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
    <div class="card" style="position:relative;max-width:340px;text-align:center;padding:26px 20px;margin:0">
      <div style="font-size:.85rem;font-weight:700;color:var(--ok-t);background:var(--ok-f);display:inline-block;padding:4px 12px;border-radius:99px">Aprovado</div>
      <h2 style="font-size:1.4rem;margin:12px 0 6px">Parabéns!</h2>
      <div>Você passou em <b>${esc(c.nome)}</b>.</div>
      <div class="meta" style="margin-top:8px">${g===n?"Era a última: semestre fechado!":`Agora são ${g} de ${n} cadeiras garantidas.`}</div>
      <button style="margin-top:16px;width:100%">Continuar</button></div>`;
  document.body.appendChild(fundo);
  const fechar=()=>{ fundo.remove(); render(); };
  fundo.querySelector("button").onclick=fechar;
  fundo.onclick=e=>{ if(e.target===fundo) fechar(); };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=fundo.querySelector("canvas"), ctx=cv.getContext("2d"), dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cores=["#FAC775","#85B7EB","#B5D4F4","#97C459","#F5C4B3","#EF9F27"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cores[Math.random()*cores.length|0]}));
  const t0=performance.now();
  (function quadro(t){
    if(!fundo.isConnected) return;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))); ctx.restore(); });
    if(t-t0<3500) requestAnimationFrame(quadro); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

function telaAgenda(){
  const it=itensAgenda(), sem=it.filter(x=>{const n=diasAte(x.data);return n>=0&&n<=6;}), prox=it.filter(x=>diasAte(x.data)>6), pas=it.filter(x=>diasAte(x.data)<0).reverse();
  let h=abas("agenda")+`<div class="linha entre" style="margin-bottom:14px"><span class="meta">${it.length} item(ns)</span><button onclick="ir('evento')">+ Evento</button></div>`;
  if(!it.length) return h+`<div class="card vazio">Nada na agenda ainda.<br>Adicione datas nas avaliações (Editar cadeira) ou crie um evento.</div>`;
  const bloco=(t,l)=>l.length?`<div class="card"><h2>${t}</h2>${l.map(itemAgendaHTML).join("")}</div>`:"";
  return h+bloco("Esta semana",sem)+bloco("Próximas semanas",prox)+bloco("Já passou",pas);
}
function telaEvento(){
  return `<div class="card">
    <label>Data</label><input type="date" id="e-data">
    <label>Cadeira</label><select id="e-cad"><option value="">Geral (sem cadeira)</option>${dados.cadeiras.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select>
    <label>Tipo</label><select id="e-tipo">${TIPOS.map(t=>`<option>${t}</option>`).join("")}</select>
    <label>Observação</label><input id="e-obs" placeholder="Ex.: entregar relatório impresso">
  </div><button onclick="salvarEvento()">Salvar evento</button>`;
}
function salvarEvento(){
  const data=document.getElementById("e-data").value; if(!data){ alertaCampo("e-data"); return; }
  dados.eventos.push({id:id(),data,cadeiraId:document.getElementById("e-cad").value,tipo:document.getElementById("e-tipo").value,obs:document.getElementById("e-obs").value.trim()});
  salvar(); ir("agenda");
}
function excluirEvento(e){ dados.eventos=dados.eventos.filter(x=>x.id!==e); salvar(); render(); }

/* ---------- Backup ---------- */
function diasDesde(iso){ return iso ? Math.floor((Date.now()-new Date(iso))/86400000) : null; }
function avisoBackup(){
  if(!dados.cadeiras.length) return "";
  const d=diasDesde(dados.ultimoBackup), base=diasDesde(dados.criadoEm);
  if(d===null ? base<7 : d<7) return "";
  const txt=d===null?"Você ainda não fez nenhum backup.":`Faz ${d} dias desde o último backup.`;
  return `<div class="card" style="border-color:var(--atencao);background:var(--aviso-fundo)">
    <div style="font-weight:700">${txt}</div>
    <div class="meta" style="margin:4px 0 10px">Salve um backup para não perder suas notas e faltas se trocar de celular ou limpar o navegador.</div>
    <button onclick="salvarBackup()">Salvar backup agora</button></div>`;
}
function cardBackup(){
  const d=diasDesde(dados.ultimoBackup);
  return `<div class="card"><h2>Backup</h2>
    <div class="meta" style="margin-bottom:10px">${d===null?"Nenhum backup salvo ainda.":d===0?"Último backup: hoje.":`Último backup: há ${d} dia(s).`}
    Guarde o arquivo no Google Drive, no e-mail ou no WhatsApp para restaurar em outro aparelho.</div>
    <div class="linha"><button onclick="salvarBackup()">Salvar backup</button>
    <button class="sec" onclick="document.getElementById('bk-in').click()">Restaurar backup</button></div>
    <input type="file" id="bk-in" accept=".json,application/json" style="display:none" onchange="lerBackup(this.files[0]);this.value=''">
    <div id="bk-msg"></div></div>`;
}
function salvarBackup(){
  dados.ultimoBackup=new Date().toISOString(); salvar();
  const blob=new Blob([JSON.stringify({app:"MeuSemestre",versao:1,salvoEm:dados.ultimoBackup,dados},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`meusemestre-backup-${dados.ultimoBackup.slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  render();
}
let _backupPendente=null;
async function lerBackup(f){
  if(!f) return;
  const msg=document.getElementById("bk-msg");
  try{
    const j=JSON.parse(await f.text()), d=j.dados||j;
    if(!Array.isArray(d.cadeiras)) throw 0;
    _backupPendente=d;
    const quando=j.salvoEm?new Date(j.salvoEm).toLocaleDateString("pt-BR"):"data desconhecida";
    msg.innerHTML=`<div class="destaque"><div style="font-weight:700">Backup de ${quando}: ${d.cadeiras.length} cadeira(s), ${(d.eventos||[]).length} evento(s).</div>
      <div class="meta" style="margin:4px 0 10px">Restaurar substitui tudo o que está neste aparelho agora.</div>
      <div class="linha"><button onclick="restaurarBackup()">Restaurar</button><button class="sec" onclick="document.getElementById('bk-msg').innerHTML=''">Cancelar</button></div></div>`;
  }catch(e){ msg.innerHTML=`<div class="aviso" style="color:var(--erro)">Este arquivo não é um backup do MeuSemestre.</div>`; }
}
function restaurarBackup(){
  if(!_backupPendente) return;
  dados=_backupPendente; dados.eventos=dados.eventos||[]; dados.ultimoBackup=dados.ultimoBackup||new Date().toISOString();
  _backupPendente=null; salvar(); ir("lista");
}

/* ---------- Importar comprovante de matrícula (PDF) ---------- */
const PDFJS=new URL("./",location.href).href;
let _importadas=[];
// Safari antigo não sabe percorrer ReadableStream com "for await"; o PDF.js precisa disso.
function polyfillStream(){
  if(typeof ReadableStream==="undefined" || ReadableStream.prototype[Symbol.asyncIterator]) return;
  const it=async function*(){ const r=this.getReader(); try{ for(;;){ const {done,value}=await r.read(); if(done) return; yield value; } } finally{ r.releaseLock(); } };
  ReadableStream.prototype[Symbol.asyncIterator]=it; if(!ReadableStream.prototype.values) ReadableStream.prototype.values=it;
}
async function linhasDoPDF(arquivo){
  polyfillStream();
  const pdfjs=await import(PDFJS+"pdf.min.js");
  pdfjs.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  const doc=await pdfjs.getDocument({data:await arquivo.arrayBuffer()}).promise;
  const linhas=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    const grupos={};
    tc.items.forEach(it=>{ if(!it.str.trim()) return; const y=Math.round(it.transform[5]/3); (grupos[y]=grupos[y]||[]).push(it); });
    Object.keys(grupos).sort((a,b)=>b-a).forEach(y=>linhas.push(grupos[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(t=>t.str.trim()).join(" ").replace(/\s+/g," ")));
  }
  return linhas;
}
function lerComprovante(linhas){
  const cad={}, ordem=[];
  const reCad=/^([A-Z]{2,4}\d{4,5})\s+(\S{1,3})\s+(\d{3,5})\s+(.+?)\s+(\d{2,3})$/;
  const reAula=/^(Segunda|Terça|Quarta|Quinta|Sexta|Sábado|Domingo)\S*\s+(\d{1,2}):(\d{2})\s+(\d{1,2}):(\d{2}).*?([A-Z]{2,4}\d{4,5})\s*-/;
  linhas.forEach(l=>{
    let m=l.match(reCad);
    if(m){ if(!cad[m[1]]){ cad[m[1]]={codigo:m[1],nome:m[4],ch:+m[5],aulas:[]}; ordem.push(m[1]); } return; }
    m=l.match(reAula);
    if(m && cad[m[6]]){ const min=(+m[4]*60+ +m[5])-(+m[2]*60+ +m[3]); cad[m[6]].aulas.push({dia:m[1],periodos:Math.max(1,Math.round(min/50))}); }
  });
  return ordem.map(k=>cad[k]);
}
async function importarPDF(f){
  if(!f) return;
  const msg=document.getElementById("imp-msg");
  msg.innerHTML=`<div class="card meta">Lendo o comprovante...</div>`;
  try{
    _importadas=lerComprovante(await linhasDoPDF(f));
    if(!_importadas.length){ msg.innerHTML=`<div class="card" style="color:var(--erro)">Não encontrei cadeiras neste PDF. Use o Comprovante de Matrícula gerado pelo Portal do Aluno.</div>`; return; }
    _importadas.forEach(c=>c.marcada=!dados.cadeiras.some(x=>x.codigo===c.codigo));
    ir("importar");
  }catch(e){ console.error(e); msg.innerHTML=`<div class="card"><div style="color:var(--erro);font-weight:700">Não consegui ler este PDF.</div>
    <div class="meta" style="margin-top:6px">Confira se é o Comprovante de Matrícula baixado do portal (não uma foto ou print). Se continuar, cadastre as cadeiras manualmente em "+ Nova cadeira".</div>
    <div class="meta" style="margin-top:6px;font-size:.75rem">Detalhe técnico: ${esc(e&&e.message||String(e))}</div></div>`; }
}
function telaImportar(){
  let h=`<div class="card meta">Encontrei ${_importadas.length} cadeira(s). Desmarque as que não quiser. Depois, abra cada cadeira para cadastrar as avaliações e os pesos.</div>`;
  _importadas.forEach((c,i)=>{
    const ja=dados.cadeiras.some(x=>x.codigo===c.codigo);
    h+=`<label class="card" style="display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin:0 0 10px">
      <input type="checkbox" style="width:22px;height:22px;flex:none;margin-top:4px" ${c.marcada?"checked":""} onchange="_importadas[${i}].marcada=this.checked">
      <div><div class="rotulo">${esc(c.codigo)} &middot; ${c.ch}h &middot; até ${faltasMax(c.ch)} faltas</div>
      <div style="color:var(--texto);font-weight:700;font-size:1.05rem;margin:2px 0">${esc(c.nome)}</div>
      <div>${c.aulas.length?c.aulas.map(a=>`${a.dia} (${a.periodos} períodos)`).join(" &middot; "):"Sem horário no comprovante"}</div>
      ${ja?`<div style="color:var(--exame)">Já cadastrada</div>`:""}</div></label>`;
  });
  return h+`<button onclick="confirmarImportacao()">Adicionar cadeiras marcadas</button>`;
}
function confirmarImportacao(){
  _importadas.filter(c=>c.marcada).forEach(c=>{
    dados.cadeiras.push({id:id(),codigo:c.codigo,nome:c.nome,ch:c.ch,periodosDia:c.aulas[0]?.periodos||2,aulas:c.aulas,faltas:0,exame:null,avaliacoes:[]});
  });
  salvar(); _importadas=[]; ir("lista");
}

/* ---------- Tema e PWA ---------- */
function sistemaEscuro(){ return matchMedia("(prefers-color-scheme: dark)").matches; }
function temaAtual(){ try{ const t=localStorage.getItem("meusemestre-tema"); if(t==="claro"||t==="escuro") return t; }catch(e){} return sistemaEscuro()?"escuro":"claro"; }
function aplicarTema(){
  const esc=temaAtual()==="escuro";
  document.documentElement.classList.toggle("escuro",esc);
  document.querySelector('meta[name=theme-color]').content=esc?"#0d1620":"#F6FAFE";
  document.getElementById("btn-tema").textContent=esc?"Modo claro":"Modo escuro";
}
function trocarTema(){
  const novo=temaAtual()==="escuro"?"claro":"escuro";
  try{ if((novo==="escuro")===sistemaEscuro()) localStorage.removeItem("meusemestre-tema"); else localStorage.setItem("meusemestre-tema",novo); }catch(e){}
  aplicarTema();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",aplicarTema);
aplicarTema();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});

render();
</script>
